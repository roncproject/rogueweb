name: Deploy Spring Boot to AWS Elastic Beanstalk

on:
    push:
        branches:
            - main  # Triggers deployment when pushing to main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
        # Step 1: Check out the source code
        - name: Checkout Source Code
          uses: actions/checkout@v4

        # Step 2: Set up Java environment
        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            distribution: 'corretto'
            java-version: '17'
            cache: 'maven' # Use 'gradle' if you use Gradle

        # Step 3: Build the application
        - name: Build with Maven
          run: mvn clean package -DskipTests

        # Step 4: Package JAR and Procfile together
        - name: Generate Deployment Package
          run: |
            zip -j rogue-deploy.zip target/*.jar Procfile

        # Step 5: Configure AWS Credentials
        # REMOVED because we are using secrets directly in the deployment step. If you prefer to configure AWS credentials separately, uncomment the following lines and remove the credentials from the deployment step.
        #- name: Configure AWS Credentials
        #  uses: aws-actions/configure-aws-credentials@v4
        #  with:
        #    aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        #    aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        #    aws-region: eu-west-3 # Change to your AWS region

        # Step 5(was 6): Deploy to Elastic Beanstalk
        - name: Deploy to AWS Elastic Beanstalk
          uses: einaregilsson/beanstalk-deploy@v22
          with:
            aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            application_name: 'rogue-aws'
            environment_name: 'my-java-env'
            version_label: 'deploy-${{ github.sha }}'
            region: eu-west-3 # Change to your AWS region
            deployment_package: rogue-deploy.zip
