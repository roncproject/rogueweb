name: CI/CD Pipeline - Spring Boot to AWS

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    # ==========================================
    # PHASE 1: CONTINUOUS INTEGRATION (TESTING)
    # ==========================================
    test:
        name: Run Tests
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Source Code
          uses: actions/checkout@v4

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            distribution: 'corretto'
            java-version: '17'
            cache: 'maven'

        # Runs all your Unit Tests and Integration Tests
        - name: Execute Tests
          run: mvn test -DskipTests

    # ==========================================
    # PHASE 2: BUILD & ARTIFACT PACKAGING
    # ==========================================
    build:
        name: Build application
        needs: test # ONLY runs if the 'test' job succeeds
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Source Code
          uses: actions/checkout@v4

        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            distribution: 'corretto'
            java-version: '17'
            cache: 'maven'

        # Skips tests here because Phase 1 already validated the code safely
        - name: Build JAR with Maven
          run: mvn clean package -DskipTests

        - name: Generate Deployment Package
          run: |
            zip -j rogue-deploy.zip target/*.jar Procfile

        # Upload the zip file so the next job can download and use it
        - name: Upload Build Artifact
          uses: actions/upload-artifact@v4
          with:
            name: deployment-zip
            path: rogue-deploy.zip
            retention-days: 1 # Automatically deletes temporary zip after 1 day

    # ==========================================
    # PHASE 3: CONTINUOUS DEPLOYMENT (AWS)
    # ==========================================
    deploy:
        name: Deploy to Elastic Beanstalk
        needs: build # ONLY runs if the 'build' job succeeds
        if: github.event_name == 'push' # Prevents PRs from deploying automatically
        runs-on: ubuntu-latest
        steps:
        - name: Download Build Artifact
          uses: actions/download-artifact@v4
          with:
            name: deployment-zip

        - name: Deploy to AWS Elastic Beanstalk
          uses: einaregilsson/beanstalk-deploy@v22
          with:
            aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            application_name: 'rogue-aws'
            environment_name: 'my-java-env'
            version_label: 'deploy-${{ github.sha }}'
            region: eu-west-3
            deployment_package: rogue-deploy.zip
